    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:224,&quot;height&quot;:820},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dash&quot;,&quot;valid&quot;,&quot;pilot&quot;,&quot;fleet&quot;,&quot;team&quot;,&quot;fin&quot;,&quot;hist&quot;,&quot;set&quot;],&quot;default&quot;:&quot;dash&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dash';
    const keys = ['dash','valid','pilot','fleet','team','fin','hist','set'];
    const bg = {}, fg = {};
    keys.forEach(k => { bg[k] = k === a ? 'rgba(245,166,35,.12)' : 'transparent'; fg[k] = k === a ? '#f5a623' : (k === 'hist' || k === 'set' ? '#8b92a8' : '#c3c8d6'); });
    return { bg, fg };
  }
}
</script>
