<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:8px;font-family:Geist,Arial,sans-serif;color:#f0f2f7;font-size:13px;flex-wrap:wrap;row-gap:8px">
  <sc-if value="{{ showPeriod }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;padding:3px;border-radius:10px;background:#0d1117;border:1px solid #1e2330">
      <sc-for list="{{ periods }}" as="p" hint-placeholder-count="4">
        <span style="padding:6px 11px;border-radius:7px;background:{{ p.bg }};color:{{ p.fg }};font-weight:{{ p.fw }};cursor:pointer;white-space:nowrap">{{ p.label }}</span>
      </sc-for>
    </div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid #1e2330;background:#0d1117;color:#c3c8d6;white-space:nowrap;cursor:pointer" style-hover="border-color:#343b4f"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8b92a8"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><span>{{ range }}</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#555e75"><path d="m6 9 6 6 6-6"></path></svg></div>
  <sc-if value="{{ showDriver }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid {{ drvBorder }};background:{{ drvBg }};color:{{ drvFg }};white-space:nowrap;cursor:pointer" style-hover="border-color:#343b4f"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>{{ driver }}</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#555e75"><path d="m6 9 6 6 6-6"></path></svg></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:60},&quot;period&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Jour&quot;,&quot;7 j&quot;,&quot;Mois&quot;,&quot;Année&quot;],&quot;default&quot;:&quot;Mois&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;range&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Septembre 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;driver&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tous les chauffeurs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showPeriod&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showDriver&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;periodOptions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const period = this.props.period ?? 'Mois';
    const opts = this.props.periodOptions ?? ['Jour', '7 j', 'Mois', 'Année', 'Dates'];
    const periods = opts.map(l => ({ label: l, bg: l === period ? '#1e2330' : 'transparent', fg: l === period ? '#f0f2f7' : '#8b92a8', fw: l === period ? 600 : 400 }));
    const driver = this.props.driver ?? 'Tous les chauffeurs';
    const filtered = driver !== 'Tous les chauffeurs';
    return {
      periods, driver,
      range: this.props.range ?? 'Septembre 2026',
      showPeriod: this.props.showPeriod ?? true,
      showDriver: this.props.showDriver ?? true,
      drvBorder: filtered ? 'rgba(245,166,35,.45)' : '#1e2330',
      drvBg: filtered ? 'rgba(245,166,35,.08)' : '#0d1117',
      drvFg: filtered ? '#f5a623' : '#c3c8d6',
    };
  }
}
</script>
</body>
</html>
